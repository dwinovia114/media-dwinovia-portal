<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telling Personal Experience</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes pulse-slow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: .8; transform: scale(1.05); }
        }
        .animate-pulse-slow { animation: pulse-slow 4s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up { animation: fadeInUp 0.5s ease-out forwards; }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }
        .animate-float { animation: float 3s ease-in-out infinite; }

        .flip-container { perspective: 1000px; }
        .flipper {
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            position: relative;
            width: 100%; height: 100%;
        }
        .flip-container.flipped .flipper { transform: rotateY(180deg); }
        .front, .back {
            backface-visibility: hidden; position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }
        .back { transform: rotateY(180deg); }
    </style>
</head>
<body class="w-screen h-screen max-h-screen overflow-hidden bg-slate-50 text-slate-800 flex flex-col font-sans select-none">

    <!-- Header -->
    <header class="h-20 border-b border-blue-900 bg-blue-950 px-6 flex items-center justify-between flex-shrink-0 z-50 shadow-lg relative" id="app-header">
        <div class="flex items-center space-x-4 shrink-0">
            <!-- Sidebar Toggle Button -->
            <button onclick="toggleSidebar()" class="p-2.5 rounded-xl bg-blue-900 hover:bg-white hover:text-blue-950 text-white border border-blue-800 transition hover:scale-105 shadow flex items-center justify-center" title="Toggle Sidebar">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
            <div class="w-10 h-10 md:w-12 md:h-12 rounded-xl bg-white flex items-center justify-center shadow-lg shadow-white/10 transform transition hover:scale-105">
                <svg class="w-6 h-6 md:w-7 md:h-7 text-blue-950" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
            </div>
            <div class="hidden sm:block">
                <h1 class="font-extrabold text-white text-lg md:text-xl tracking-tight leading-tight">Telling Personal Experience</h1>
                <p class="text-xs text-blue-200 font-medium mt-0.5">Grade 9 Module</p>
            </div>
        </div>
        <div class="flex items-center space-x-3 shrink-0" id="header-actions"></div>
    </header>

    <div class="flex-1 flex overflow-hidden relative">
        <!-- Collapsible Sidebar Menu -->
        <!-- Note: We use lg:-ml-72 in JS for smooth sliding on desktop. Adding it here in comments ensures Tailwind CDN compiles it: lg:-ml-72 -->
        <aside id="app-sidebar" class="w-72 bg-blue-950 border-r border-blue-900 flex flex-col transition-all duration-300 absolute inset-y-0 left-0 z-40 transform -translate-x-full lg:translate-x-0 lg:static shadow-2xl lg:shadow-none">
            <div class="p-4 border-b border-blue-900 flex items-center justify-between lg:hidden">
                <span class="text-white font-bold text-lg">Module Menu</span>
                <button onclick="toggleSidebar()" class="p-2 rounded-lg bg-blue-900 text-white hover:bg-blue-800">✕</button>
            </div>
            <div class="flex-1 overflow-y-auto p-4 space-y-6 no-scrollbar" id="sidebar-nav-content"></div>
        </aside>

        <!-- Backdrop for mobile sidebar -->
        <div id="sidebar-backdrop" onclick="toggleSidebar()" class="fixed inset-0 bg-black/50 z-30 hidden lg:hidden backdrop-blur-sm transition-opacity"></div>

        <!-- Main Content Area -->
        <main class="flex-1 overflow-hidden relative flex flex-col bg-slate-50 z-10">
            <div class="flex-1 overflow-y-auto p-6 md:p-10 relative flex flex-col justify-start scroll-smooth" id="main-content-wrapper">
                <div id="main-content" class="w-full flex-grow flex flex-col space-y-12 pb-12"></div>
            </div>

            <!-- Footer -->
            <footer class="h-20 border-t border-blue-900 bg-blue-950 px-6 md:px-10 flex items-center justify-between flex-shrink-0 z-10 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.2)]" id="app-footer"></footer>
        </main>
    </div>

    <script>
        const categories = ['Home', 'Recount Text', 'Language Features', 'Expressions', 'Vocabulary', 'Practice'];
        
        const topics = [
            { id: 'welcome', title: '00. Overview', category: 'Home' },
            { id: 'recount_def', title: 'A.1 Definition & Function', category: 'Recount Text' },
            { id: 'recount_char', title: 'A.2 Characteristics', category: 'Recount Text' },
            { id: 'recount_struct', title: 'A.3 Generic Structures', category: 'Recount Text' },
            { id: 'recount_5w1h', title: 'A.4 Information (5W+1H)', category: 'Recount Text' },
            { id: 'lang_pronouns', title: 'L.1 Personal Pronouns', category: 'Language Features' },
            { id: 'lang_past', title: 'L.2 Simple Past Tense', category: 'Language Features' },
            { id: 'lang_connectives', title: 'L.3 Time Connectives', category: 'Language Features' },
            { id: 'lang_adverbs', title: 'L.4 Adverb of Time', category: 'Language Features' },
            { id: 'lang_emotive', title: 'L.5 Emotive Words', category: 'Language Features' },
            { id: 'lang_descriptive', title: 'L.6 Descriptive Words', category: 'Language Features' },
            { id: 'lang_summary_ex', title: 'L.7 Summary Example', category: 'Language Features' },
            { id: 'lang_summary', title: 'L.8 Quick Summary', category: 'Language Features' },
            { id: 'exp_surprise', title: 'B.1 Surprise', category: 'Expressions' },
            { id: 'exp_disbelief', title: 'B.2 Disbelief', category: 'Expressions' },
            { id: 'exp_vs', title: 'B.3 Surprise vs. Disbelief', category: 'Expressions' },
            { id: 'vocab_positive', title: 'C.1 Positive Feelings', category: 'Vocabulary' },
            { id: 'vocab_negative', title: 'C.2 Negative Feelings', category: 'Vocabulary' },
            { id: 'exp_dialogue', title: 'D.1 Dialogue Practice', category: 'Practice' }
        ];

        let state = {
            activeTopic: 'welcome',
            activeCategory: 'Home'
        };

        function getCurrentIndex() { return topics.findIndex(t => t.id === state.activeTopic); }
        function getCurrentTopicObj() { return topics.find(t => t.id === state.activeTopic) || topics[0]; }

        window.toggleSidebar = function() {
            const sidebar = document.getElementById('app-sidebar');
            const backdrop = document.getElementById('sidebar-backdrop');
            
            if (window.innerWidth >= 1024) {
                // Desktop toggle with slide effect (toggles margin-left to collapse the width smoothly)
                sidebar.classList.toggle('lg:-ml-72');
            } else {
                // Mobile toggle
                sidebar.classList.toggle('-translate-x-full');
                backdrop.classList.toggle('hidden');
            }
        }

        window.handleTopicClick = function(topicId) {
            state.activeTopic = topicId;
            const topic = topics.find(t => t.id === topicId);
            if (topic) state.activeCategory = topic.category;
            renderApp();
            
            // Close sidebar on mobile whenever a topic is selected
            if (window.innerWidth < 1024) {
                const sidebar = document.getElementById('app-sidebar');
                const backdrop = document.getElementById('sidebar-backdrop');
                if (sidebar && !sidebar.classList.contains('-translate-x-full')) {
                    sidebar.classList.add('-translate-x-full');
                }
                if (backdrop && !backdrop.classList.contains('hidden')) {
                    backdrop.classList.add('hidden');
                }
            }
        };

        window.handleNext = function() {
            const idx = getCurrentIndex();
            if (idx < topics.length - 1) handleTopicClick(topics[idx + 1].id);
        };

        window.handlePrev = function() {
            const idx = getCurrentIndex();
            if (idx > 0) handleTopicClick(topics[idx - 1].id);
        };

        let availableVoices = [];
        function loadVoices() {
            availableVoices = window.speechSynthesis.getVoices();
        }
        if ('speechSynthesis' in window) {
            loadVoices();
            if (speechSynthesis.onvoiceschanged !== undefined) {
                speechSynthesis.onvoiceschanged = loadVoices;
            }
        }

        function getVoiceByGender(gender) {
            let enVoices = availableVoices.filter(v => v.lang.startsWith('en'));
            if (enVoices.length === 0) enVoices = availableVoices;
            if (gender === 'female') {
                return enVoices.find(v => /female|woman|samantha|zira|victoria|monica|susan/i.test(v.name)) || enVoices[0];
            } else {
                return enVoices.find(v => /male|man|alex|david|mark|george|arthur/i.test(v.name)) || enVoices.reverse()[0];
            }
        }

        window.speakText = function(text, event) {
            if (event) event.stopPropagation();
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 0.9;
                utterance.lang = 'en-US';
                window.speechSynthesis.speak(utterance);
            }
        };

        window.speakTitle = function() {
            const topic = getCurrentTopicObj();
            speakText(`You are studying ${topic.title}`);
        };

        window.currentDialogStep = 0;
        const dialogLines = [
            { name: "Rina", gender: "female", text: "Hi, Aldo! How was your holiday?", side: "left" },
            { name: "Aldo", gender: "male", text: "It was amazing! My family suddenly took me to Bali.", side: "right" },
            { name: "Rina", gender: "female", text: "Really? What a surprise! I didn't know about it.", side: "left" },
            { name: "Aldo", gender: "male", text: "Yes! My parents told me one day before the trip.", side: "right" },
            { name: "Rina", gender: "female", text: "Are you serious? You went to Bali without planning it?", side: "left" },
            { name: "Aldo", gender: "male", text: "Yes. At first, I was nervous, but then I felt delighted.", side: "right" },
            { name: "Rina", gender: "female", text: "Wow! What did you do there?", side: "left" },
            { name: "Aldo", gender: "male", text: "We visited the beach and watched the sunset. I felt very peaceful.", side: "right" }
        ];

        window.startDialogueSequence = function() {
            const startPrompt = document.getElementById('dialog-start-prompt');
            const btnText = document.getElementById('dialog-btn-text');
            const btnIcon = document.getElementById('dialog-btn-icon');
            const btn = document.getElementById('dialog-btn');
            
            if (btnText.innerText === "Playing Conversation...") return;
            if(startPrompt) startPrompt.style.display = 'none';

            if(window.currentDialogStep >= dialogLines.length) {
                window.currentDialogStep = 0;
                for(let i=0; i<dialogLines.length; i++) {
                    const bubble = document.getElementById('dialog-bubble-' + i);
                    if(bubble) {
                        bubble.classList.add('hidden');
                        bubble.classList.remove('animate-fade-in-up');
                    }
                }
            }

            btnText.innerText = "Playing Conversation...";
            btnIcon.innerText = "⏳";
            btn.classList.add('opacity-70', 'cursor-not-allowed', 'scale-95');

            window.playNextDialog();
        };

        window.playNextDialog = function() {
            if (state.activeTopic !== 'exp_dialogue') {
                if ('speechSynthesis' in window) window.speechSynthesis.cancel();
                return;
            }

            if(window.currentDialogStep < dialogLines.length) {
                const line = dialogLines[window.currentDialogStep];
                const bubble = document.getElementById('dialog-bubble-' + window.currentDialogStep);
                
                bubble.classList.remove('hidden');
                bubble.classList.add('animate-fade-in-up');
                
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(line.text);
                    utterance.rate = 0.9;
                    utterance.lang = 'en-US';
                    const voice = getVoiceByGender(line.gender);
                    if(voice) utterance.voice = voice;
                    utterance.pitch = line.gender === 'female' ? 1.3 : 0.8; 
                    
                    utterance.onend = function() {
                        window.currentDialogStep++;
                        setTimeout(() => {
                            if(state.activeTopic === 'exp_dialogue') {
                                window.playNextDialog();
                            }
                        }, 500); 
                    };

                    utterance.onerror = function() {
                        window.currentDialogStep++;
                        setTimeout(() => {
                             if(state.activeTopic === 'exp_dialogue') window.playNextDialog();
                        }, 500);
                    }

                    window.speechSynthesis.speak(utterance);
                } else {
                    window.currentDialogStep++;
                    setTimeout(() => window.playNextDialog(), 2500);
                }
                
                setTimeout(() => {
                    const container = document.getElementById('chat-container');
                    if(container) container.scrollTo({ top: container.scrollHeight, behavior: 'smooth' });
                }, 50);

            } else {
                const btnText = document.getElementById('dialog-btn-text');
                const btnIcon = document.getElementById('dialog-btn-icon');
                const btn = document.getElementById('dialog-btn');
                
                if (btnText) btnText.innerText = "Restart Conversation";
                if (btnIcon) btnIcon.innerText = "🔄";
                if (btn) btn.classList.remove('opacity-70', 'cursor-not-allowed', 'scale-95');
            }
        };

        function renderHeaderActions() {
            document.getElementById('header-actions').innerHTML = `
                <button onclick="speakTitle()" class="p-2.5 rounded-xl bg-blue-900 hover:bg-white hover:text-blue-950 text-white border border-blue-800 transition hover:scale-105 shadow" title="Read Title">🔊</button>
            `;
        }

        function renderSidebarNav() {
            let html = '';
            categories.forEach(category => {
                const catTopics = topics.filter(t => t.category === category);
                html += `
                    <div class="space-y-1.5">
                        <div class="px-3 text-xs font-black uppercase tracking-wider text-blue-400 mb-2">${category}</div>
                        <div class="space-y-1">`;
                catTopics.forEach(t => {
                    const isActive = t.id === state.activeTopic;
                    const activeClass = isActive ? 'bg-blue-800 text-white font-bold border-l-4 border-white shadow' : 'text-blue-200 hover:bg-blue-900/60 hover:text-white font-medium border-l-4 border-transparent';
                    html += `
                        <button onclick="handleTopicClick('${t.id}')" class="w-full text-left px-3 py-2.5 rounded-xl text-sm transition-all flex items-center space-x-2 ${activeClass}">
                            <span class="truncate">${t.title}</span>
                        </button>`;
                });
                html += `</div></div>`;
            });
            document.getElementById('sidebar-nav-content').innerHTML = html;
        }

        function renderFooter() {
            const currentIndex = getCurrentIndex();
            const currentTopic = getCurrentTopicObj();
            const isPrevDisabled = currentIndex === 0;
            const isNextDisabled = currentIndex === topics.length - 1;

            const prevClass = isPrevDisabled ? 'opacity-40 cursor-not-allowed text-blue-400 bg-blue-950 border-blue-900' : 'bg-blue-800 hover:bg-blue-700 text-white border-blue-700 hover:scale-105 shadow';
            const nextClass = isNextDisabled ? 'opacity-40 cursor-not-allowed text-blue-400 bg-blue-950 border-blue-900' : 'bg-white hover:bg-blue-50 text-blue-950 font-extrabold shadow-lg shadow-blue-900/10 hover:scale-105 border-blue-200';

            document.getElementById('app-footer').innerHTML = `
                <button ${isPrevDisabled ? 'disabled' : ''} onclick="handlePrev()" class="px-6 py-3 rounded-xl text-sm font-bold flex items-center space-x-2 transition-all border ${prevClass}">
                    <span>← Previous Topic</span>
                </button>
                <span class="text-sm text-slate-400 font-medium hidden sm:inline">Module: <strong class="text-white text-base ml-2">${currentTopic.title}</strong></span>
                <button ${isNextDisabled ? 'disabled' : ''} onclick="handleNext()" class="px-6 py-3 rounded-xl text-sm flex items-center space-x-2 transition-all border border-transparent ${nextClass}">
                    <span>Next Topic →</span>
                </button>
            `;
        }

        const buildHeader = (topicStr, title, subtitle) => `
            <div class="border-b border-blue-200 pb-5">
                <span class="text-sm font-bold text-blue-600 tracking-widest uppercase">${topicStr}</span>
                <h2 class="text-3xl md:text-4xl font-extrabold text-blue-950 mt-2">${title}</h2>
                ${subtitle ? `<p class="text-slate-600 mt-2 text-lg">${subtitle}</p>` : ''}
            </div>
        `;

        const buildSubHeader = (title, subtitle) => `
            <div class="mb-5 border-l-4 border-blue-500 pl-4 animate-fade-in-up">
                <h3 class="text-2xl font-extrabold text-blue-900">${title}</h3>
                ${subtitle ? `<p class="text-slate-600 mt-1 text-base md:text-lg">${subtitle}</p>` : ''}
            </div>
        `;

        function getTopicPages(topicId) {
            let pages = [];

            if (topicId === 'welcome') {
                pages.push(`
                <div class="relative w-full flex items-center justify-center max-w-6xl mx-auto py-10 md:py-20 animate-fade-in-up">
                    <div class="absolute top-0 left-0 w-96 h-96 bg-blue-400/10 rounded-full blur-3xl mix-blend-screen animate-pulse-slow pointer-events-none"></div>
                    <div class="absolute bottom-0 right-0 w-[30rem] h-[30rem] bg-blue-600/5 rounded-full blur-3xl mix-blend-screen animate-pulse-slow pointer-events-none" style="animation-delay: 1.5s;"></div>
                    <div class="relative z-10 flex flex-col md:flex-row items-center gap-16 w-full">
                        <div class="flex-1 space-y-8 text-center md:text-left z-20">
                            <div class="inline-flex items-center space-x-3 px-5 py-2.5 bg-white border border-blue-200 rounded-full text-blue-900 text-sm font-bold uppercase tracking-widest shadow-sm">
                                <span class="animate-bounce inline-block text-lg">✨</span><span>Interactive English Module</span>
                            </div>
                            <h2 class="text-5xl md:text-7xl font-extrabold text-blue-950 tracking-tight leading-tight">Mastering <br/><span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-800 to-blue-500">Personal Experience</span></h2>
                            <p class="text-slate-600 text-lg leading-relaxed max-w-xl mx-auto md:mx-0">Step into an engaging digital journey! Learn how to beautifully recount your past stories, express sudden surprises naturally, and expand your vocabulary. Scroll down or use the sidebar menu to begin!</p>
                            <div class="pt-4 flex justify-center md:justify-start">
                                <button onclick="handleNext()" class="group relative px-10 py-5 bg-blue-950 hover:bg-blue-800 text-white rounded-2xl text-lg font-extrabold shadow-xl shadow-blue-900/20 transition-all hover:-translate-y-1 overflow-hidden">
                                    <span class="relative flex items-center space-x-3"><span>Start Learning Journey</span><svg class="w-6 h-6 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 5l7 7-7 7M5 5l7 7-7 7"></path></svg></span>
                                </button>
                            </div>
                        </div>
                        <div class="flex-1 w-full max-w-lg relative hidden md:block min-h-[450px]">
                            <div class="absolute top-0 right-10 w-72 p-6 bg-blue-950 backdrop-blur-xl border border-blue-800 rounded-3xl shadow-2xl transform rotate-6 hover:rotate-0 hover:scale-105 transition-all duration-500 z-10 animate-float"><div class="w-14 h-14 rounded-2xl bg-white text-blue-900 flex items-center justify-center text-3xl mb-5 font-bold shadow-sm">📖</div><h3 class="text-white font-bold text-xl mb-2">Recount Text</h3><p class="text-sm text-blue-200 leading-relaxed">Master the 5W+1H, generic structures, and Simple Past Tense storytelling.</p></div>
                            <div class="absolute bottom-10 left-0 w-72 p-6 bg-blue-950 backdrop-blur-xl border border-blue-800 rounded-3xl shadow-2xl transform -rotate-3 hover:rotate-0 hover:scale-105 transition-all duration-500 z-20 animate-float" style="animation-delay: 1s;"><div class="w-14 h-14 rounded-2xl bg-white text-blue-900 flex items-center justify-center text-3xl mb-5 font-bold shadow-sm">😲</div><h3 class="text-white font-bold text-xl mb-2">Expressions & Vocab</h3><p class="text-sm text-blue-200 leading-relaxed">Learn how to react to unexpected news naturally and fluently.</p></div>
                        </div>
                    </div>
                </div>`);
            } 
            else if (topicId === 'recount_def') {
                pages.push(`
                <div class="max-w-5xl mx-auto space-y-8 animate-fade-in-up w-full">
                    ${buildHeader('Module A.1', 'Definition & Social Function')}
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div class="bg-white hover:bg-blue-50 transition-colors border border-blue-200 rounded-3xl p-8 space-y-4 shadow-lg group"><div class="flex items-center space-x-3 text-blue-950 font-bold text-xl border-b border-blue-100 pb-4"><span class="text-3xl group-hover:scale-110 transition-transform">📚</span><h3>Definition</h3></div><p class="text-lg text-slate-700 leading-relaxed pt-2">A <strong class="text-blue-950 font-black">Personal Recount Text</strong> is a type of spoken or written text that retells past events or personal experiences that the author has lived through in chronological order.</p></div>
                        <div class="bg-white hover:bg-blue-50 transition-colors border border-blue-200 rounded-3xl p-8 space-y-4 shadow-lg group"><div class="flex items-center space-x-3 text-blue-950 font-bold text-xl border-b border-blue-100 pb-4"><span class="text-3xl group-hover:scale-110 transition-transform">🎯</span><h3>Social Function</h3></div><ul class="text-lg text-slate-700 space-y-4 list-disc list-inside leading-relaxed pt-2"><li>To retell past experiences to family, friends, or readers.</li><li>To <strong class="text-blue-950 font-black">inform</strong> the audience about what happened.</li><li>To <strong class="text-blue-950 font-black border-b-2 border-blue-400">entertain</strong> or share emotional connections through personal stories.</li></ul></div>
                    </div>
                    <div class="bg-blue-950 text-white rounded-3xl p-6 md:p-8 space-y-3 shadow-xl relative overflow-hidden animate-float" style="animation-duration: 4s;"><h4 class="text-sm font-extrabold uppercase tracking-widest flex items-center space-x-2 text-blue-300"><span class="text-xl">💡</span> <span>Key Takeaway for 9th Graders</span></h4><p class="text-lg font-medium leading-relaxed relative z-10 mt-2">Unlike fictional stories (narrative), a Personal Recount is strictly based on <strong class="font-extrabold text-xl bg-blue-800 px-2 rounded">REAL</strong> personal occurrences (e.g., "My Holiday in Bali", "A Memorable Camping Trip").</p></div>
                </div>`);
            }
            else if (topicId === 'recount_char') {
                const chars = [
                    { num: "01", title: "First-Person Perspective", desc: "Uses personal pronouns such as I, WE, MY FAMILY, OUR CLASS." },
                    { num: "02", title: "Chronological Sequence", desc: "Events are told in real-time order using sequence connectors (first, next, then, finally)." },
                    { num: "03", title: "Past Tense Predominance", desc: "Action verbs are written in Simple Past Tense (e.g., went, visited, played, bought)." },
                    { num: "04", title: "Specific Participants", desc: "Focuses on specific actors (me, my best friend) rather than general subjects." }
                ];
                let charHtml = chars.map((item, index) => `
                    <div class="bg-white hover:bg-blue-50 transition-all duration-300 border border-blue-200 p-6 rounded-3xl flex items-start space-x-5 shadow-lg group animate-fade-in-up" style="animation-delay: ${index * 0.1}s">
                        <span class="text-2xl font-mono font-black text-blue-900 bg-blue-100 p-4 rounded-2xl border border-blue-200 shadow-sm group-hover:bg-white transition-colors">${item.num}</span>
                        <div class="pt-1"><h3 class="text-xl font-bold mb-2 text-blue-950">${item.title}</h3><p class="text-base text-slate-600 leading-relaxed">${item.desc}</p></div>
                    </div>`).join('');
                pages.push(`

                <div class="max-w-5xl mx-auto space-y-6 animate-fade-in-up w-full">
                    ${buildHeader('Module', getCurrentTopicObj().title)}
                    <div class="bg-white p-8 rounded-3xl border border-blue-200 shadow-lg text-center py-16">
                        <span class="text-6xl block mb-4 animate-bounce">🚧</span><h3 class="text-2xl font-bold text-blue-950 mb-2">Content Under Construction</h3><p class="text-lg text-slate-600">This module is currently being updated.</p>
                    </div>
                </div>`);
            }
            return pages;
        }

        function renderContent() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
            
            if (state.activeTopic === 'exp_dialogue') {
                window.currentDialogStep = 0;
            }

            const container = document.getElementById('main-content');
            const wrapper = document.getElementById('main-content-wrapper');
            const pages = getTopicPages(state.activeTopic);
            
            const dividerHTML = `<div class="w-full flex justify-center py-4 md:py-8"><div class="w-2/3 border-b-2 border-dashed border-blue-300 opacity-50"></div></div>`;
            
            container.innerHTML = pages.join(dividerHTML);
            wrapper.scrollTo(0, 0);
        }

        function renderApp() {
            renderHeaderActions();
            renderSidebarNav();
            renderContent();
            renderFooter();
        }

        window.onload = () => { renderApp(); };

        document.addEventListener('keydown', (event) => {
            if (event.target.tagName === 'INPUT' || event.target.tagName === 'TEXTAREA') return;
            if (event.key === 'ArrowRight') {
                event.preventDefault();
                window.handleNext();
            } else if (event.key === 'ArrowLeft') {
                event.preventDefault();
                window.handlePrev();
            }
        });
    </script>
</body>
</html>
